<!DOCTYPE html>

<head>

        /* ================= CSS STYLES ================= */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            user-select: none; -webkit-user-select: none; touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05050a; display: flex; justify-content: center;
            align-items: center; height: 100vh; width: 100vw; overflow: hidden; color: white;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            max-width: 56.25vh; max-height: 100vh;
            background-color: #0a0a12; overflow: hidden;
            border-left: 4px solid #00e5ff; border-right: 4px solid #00e5ff; border-bottom: 4px solid #00e5ff;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: background-image 0.6s ease-in-out;
        }

        canvas { display: block; width: 100%; height: 100%; background-color: transparent; }

        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            10% { transform: translate(-2px, -3px) rotate(-1deg); }
            20% { transform: translate(-4px, 0px) rotate(1deg); }
            30% { transform: translate(4px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -2px) rotate(1deg); }
            50% { transform: translate(-2px, 3px) rotate(-1deg); }
            60% { transform: translate(-4px, 2px) rotate(0deg); }
            70% { transform: translate(4px, 2px) rotate(-1deg); }
            80% { transform: translate(-2px, -2px) rotate(1deg); }
            90% { transform: translate(2px, 3px) rotate(0deg); }
            100% { transform: translate(2px, -3px) rotate(-1deg); }
        }
        .shake-active { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        
        .shake-mild { animation: shake 0.15s cubic-bezier(.36,.07,.19,.97) both; }

        /* ================= UI Overlays ================= */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;

<script>
/* ================= SDK INIT ================= */
window.addEventListener('load', async () => {

/* ================= AUDIO SYSTEM (ROBUST BGM FIX) ================= */
let audioCtx = null; 
let isMuted = false;
let audioUnlocked = false;

// ⚠️ YAHAN APNI AUDIO FILE KA NAAM LIKHEN
const bgMusic = new Audio('Titan_Ore_Runner.mp3'); 
bgMusic.loop = true;
bgMusic.volume = 0.4;

function unlockAudio() {
    if (audioUnlocked) return;
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (!isMuted) { 
        let playPromise = bgMusic.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                audioUnlocked = true;
            }).catch(e => {
                console.log("Browser needs interaction first...", e);
            });
        }
    } else {
        audioUnlocked = true;
    }
}

// BGM tab play hoga jab user pehli baar kahin bhi click karega
document.body.addEventListener('click', unlockAudio, { once: true });
document.body.addEventListener('touchstart', unlockAudio, { once: true });

function initAudio() { unlockAudio(); }

function toggleSound() {
    isMuted = !isMuted; const btn = document.getElementById('btn-sound-toggle');
    if (isMuted) { 
        bgMusic.pause(); 
        btn.innerText = "🔇 OFF"; btn.style.borderColor = "#ff4444"; btn.style.color = "#ff4444"; 
    } else { 
        unlockAudio(); 
        bgMusic.play().catch(()=>{}); 
        btn.innerText = "🔊 ON"; btn.style.borderColor = "#00e5ff"; btn.style.color = "#00e5ff"; 
    }
}

function playTone(freq, type, duration, vol, sweepDown = false, sweepUp = false) {
    if (!audioCtx || isMuted) return;
    try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (sweepDown) osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        if (sweepUp) osc.frequency.exponentialRampToValueAtTime(freq * 2, audioCtx.currentTime + duration);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

function triggerShake(type = 'mild') {
    const container = document.getElementById('game-container');
    container.classList.remove('shake-active', 'shake-mild');
    void container.offsetWidth; // trigger reflow
    container.classList.add(type === 'strong' ? 'shake-active' : 'shake-mild');
    setTimeout(() => { container.classList.remove('shake-active', 'shake-mild'); }, type === 'strong' ? 400 : 150);
}

function updateTopBound() {
    const hud = document.getElementById('game-hud');
    if (hud && !hud.classList.contains('hidden')) {
        const rect = canvas.getBoundingClientRect();
        if (rect.height > 0) topBound = hud.offsetHeight * (gameHeight / rect.height);
    }
}

let baseX = gameWidth / 2; let nextBaseX = baseX;
let currentDrag = {x: 0, y: 0}; let aimAngle = 0; let isValidAim = false;
let ballsFiredCount = 0; let frameCounter = 0; let framesBetweenShots = 6; 
let ballSpeed = 16; let firstBallLanded = false; let blocksFrozen = false;

function generateDistinctLevelLayout(lvl) {
    let layout = []; let cols = 9; 
    let phase = (lvl - 1) % 6; let difficulty = "easy";
    if (phase === 2) difficulty = "hard"; else if (phase === 4 || phase === 5) difficulty = "pro";
    let actualRows = (difficulty === "easy") ? 4 : (difficulty === "hard" ? 6 : 9);

    for (let r = 0; r < actualRows; r++) {
        let row = new Array(cols).fill(0);
        for (let c = 0; c < cols; c++) {
            let blockType = Math.floor(Math.random() * 6) + 1;
            if (difficulty === "easy") {
                if (r % 2 === 0 && c % 2 !== 0) row[c] = blockType;
                else if (r % 2 !== 0 && c % 2 === 0 && c > 1 && c < cols-2) row[c] = blockType;
            } else if (difficulty === "hard") {
                if (r === 0 || r === 1) row[c] = blockType; 
                else if (c === 0 || c === cols - 1) row[c] = blockType; 
                else if (r === 3 && c === 4) row[c] = blockType; 
            } else if (difficulty === "pro") {
                if (phase === 4) { if (r <= Math.abs(c - 4) + 2) row[c] = blockType; if (r === actualRows - 1) row[c] = blockType; } 
                else { if ((r + c) % 2 === 0 || r === 0 || c === 0 || c === cols - 1) row[c] = blockType; }
            }
        }
        if (row.some(val => val > 0)) layout.push(row);
    }
    if (layout.length === 0) layout.push([0, 1, 1, 1, 1, 1, 1, 1, 0]);
    return layout;
}

function calculateBlockHP(lvl, isCenter) {
    let phase = (lvl - 1) % 6; let isHard = (phase === 2); let isPro = (phase >= 4);
    let hpMultiplier = isCenter ? 2.5 : 1.0; let diff = isPro ? 3.0 : (isHard ? 2.0 : 1.0); 
    let baseHP = Math.floor((lvl * 1.5) + Math.pow(lvl, 1.05)) * diff; 
    return Math.max(1, Math.floor(baseHP * hpMultiplier));
}

function loadLevel(lvl) {
    try { if(window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStart(); } catch(e){}

    document.getElementById('game-hud').classList.remove('hidden'); updateTopBound();
    currentLevel = lvl; blocks = []; particles = []; lasers = []; lightning = []; drops = [];
    blocksFrozen = false; baseX = gameWidth / 2; nextBaseX = baseX;
    
    if(timerInterval) clearInterval(timerInterval);
    levelConstraint = { type: 'none', value: 0 };

    if (lvl > 2) {
        let constraintRoll = Math.random();
        if (constraintRoll < 0.35) { levelConstraint = { type: 'time', value: Math.max(25, 90 - Math.floor(lvl / 2)) }; } 
        else if (constraintRoll < 0.70) { levelConstraint = { type: 'shots', value: Math.max(10, 30 - Math.floor(lvl / 4)) }; }
    }

    if (levelConstraint.type === 'time') {
        timerInterval = setInterval(() => {
            if([STATE.IDLE, STATE.AIMING, STATE.SHOOTING].includes(gameState)) {
                levelConstraint.value--; updateUI();
                if (levelConstraint.value <= 0) { triggerGameOver("Time's Up!"); }
            }
        }, 1000);
    }

    updateLevelBackground(lvl);
    balls = Array.from({length: 5}, () => ({ x: baseX, y: bottomY - 8, vx: 0, vy: 0, r: 4.5, active: false, returning: false, isClone: false }));

    let cols = 9; let layout = generateDistinctLevelLayout(lvl); 
    let colGap = 2; let rowGap = 2; let brickWidth = 46; let brickHeight = 46;
    let totalGridWidth = (cols * brickWidth) + ((cols - 1) * colGap);
    let startX = (gameWidth - totalGridWidth) / 2; 

    for (let r = 0; r < layout.length; r++) {
        let currentX = startX; 
        for (let c = 0; c < cols; c++) {
            let blockType = layout[r][c];
            if (blockType !== 0) {
                let isSquare = (blockType <= 2); let imgList = isSquare ? ASSETS.squares : ASSETS.triangles;
                let triangleOrientation = ((c + r) % 2 === 0) ? 'up' : 'down';
                let isCenter = (c === Math.floor(cols / 2));
                
                blocks.push({
                    x: currentX, y: topBound + 15 + (r * (brickHeight + rowGap)), 
                    w: brickWidth, h: brickHeight, hp: calculateBlockHP(lvl, isCenter), 
                    active: true, shape: isSquare ? 'square' : 'triangle', 
                    orientation: isSquare ? 'none' : triangleOrientation,
                    img: imgList[Math.floor(Math.random() * imgList.length)]
                });
            }
            currentX += brickWidth + colGap;
        }
    }
    updateUI(); gameState = STATE.IDLE; showScreen(null);
}

}

function buildLevelGrid() {

        let btn = document.createElement('div'); btn.className = 'lvl-btn'; let prestige = Math.floor((i - 1) / 100);

        } else { btn.innerHTML = `🔒<br><span style="font-size:12px;">${i}</span>`; }
        grid.appendChild(btn);
    }
    setTimeout(() => { grid.scrollTop = grid.scrollHeight; }, 10);
}

function setupGameEvents() {
    window.addEventListener('resize', updateTopBound); 
    const getTouchPos = (e) => {
        let rect = canvas.getBoundingClientRect();
        return { x: ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) * (canvas.width / rect.width), y: ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) * (canvas.height / rect.height) };
    };

    const handleStart = (e) => {
        let pos = getTouchPos(e); if (pos.y < topBound || gameState !== STATE.IDLE) return; 
        currentDrag = pos; gameState = STATE.AIMING; isValidAim = false;
    };

    const handleMove = (e) => {
        if (gameState !== STATE.AIMING) return; currentDrag = getTouchPos(e);
        let dx = currentDrag.x - baseX; let dy = currentDrag.y - (bottomY - 8);
        if (Math.hypot(dx, dy) > 10) {
            aimAngle = Math.atan2(dy, dx);
            if (aimAngle < -0.15 && aimAngle > -Math.PI + 0.15) { isValidAim = true; document.getElementById('cancel-text').classList.add('hidden'); } 
            else { isValidAim = false; document.getElementById('cancel-text').classList.remove('hidden'); }
        } else { isValidAim = false; }
    };

    const handleEnd = () => {
        if (gameState !== STATE.AIMING) return;
        document.getElementById('cancel-text').classList.add('hidden'); 
        if (isValidAim) {
            if (levelConstraint.type === 'shots') { levelConstraint.value--; updateUI(); }
            gameState = STATE.SHOOTING; firstBallLanded = false; ballsFiredCount = 0; frameCounter = framesBetweenShots; 
            balls.filter(b => !b.isClone).forEach(b => { b.x = baseX; b.y = bottomY - b.r; b.active = false; b.returning = false; });
        } else { gameState = STATE.IDLE; }
    };

    canvas.addEventListener('mousedown', handleStart); window.addEventListener('mousemove', handleMove); window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive: false}); window.addEventListener('touchmove', handleMove, {passive: false}); window.addEventListener('touchend', handleEnd);
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
    document.getElementById('game-hud').classList.add('hidden');
    if (id) document.getElementById(id).classList.remove('hidden');
    if ([STATE.IDLE, STATE.AIMING, STATE.SHOOTING, STATE.PAUSED, STATE.POWERUP_ANIM, STATE.ABILITY_SELECT].includes(gameState)) {
        document.getElementById('game-hud').classList.remove('hidden'); updateTopBound();
    }
}

function triggerPowerupDraft() {
    if (gameState === STATE.AIMING) { gameState = STATE.IDLE; document.getElementById('cancel-text').classList.add('hidden'); }
    previousState = gameState; gameState = STATE.ABILITY_SELECT;
    
    let keys = Object.keys(ABILITIES_INFO).sort(() => 0.5 - Math.random()).slice(0, 3);
    const container = document.getElementById('card-container'); container.innerHTML = '';
    
    keys.forEach(key => {
        let info = ABILITIES_INFO[key]; let card = document.createElement('div');
        card.className = 'ability-card'; card.style.borderColor = info.color;
        card.innerHTML = `<div class="ability-icon">${info.icon}</div><h3>${info.name}</h3><p>${info.desc}</p>`;
        card.onclick = () => {
            if (gameState !== STATE.ABILITY_SELECT) return; 
            SFX.click(); gameState = previousState; showScreen(null); executePowerupInstantly(key); 
        };
        container.appendChild(card);
    });
    showScreen('screen-cards');
}

function executePowerupInstantly(type) {
    let activeBlocks = blocks.filter(b => b.active);
    if (activeBlocks.length === 0 && type !== 'extraballs' && type !== 'fire') return;
    let dmg = getHeroDmg();

    if (type === 'fire') {
        SFX.shoot(); for (let i = 0; i < 5; i++) { lasers.push({ x: (gameWidth / 6) * (i + 1), y: bottomY - 25, w: 8, h: 30, active: true }); }
    } else if (type === 'extraballs') {
        let soundPlayed = false;
        for (let i = 0; i < 5; i++) {
            if(!soundPlayed){ playTone(500, 'triangle', 0.25, 0.08, false, true); soundPlayed=true;}
            let angle = -Math.PI / 6 - (i * (Math.PI / 6)); 
            balls.push({ x: baseX, y: bottomY - 15, vx: Math.cos(angle) * ballSpeed, vy: Math.sin(angle) * ballSpeed, r: 4.5, active: true, returning: false, isClone: true });
        }
        createParticle(baseX, bottomY - 30, '+5 BALLS!', '#00ffcc');
    } else {
        let cacheState = gameState; gameState = STATE.POWERUP_ANIM;
        if (type === 'shock') {
            SFX.zap(); activeBlocks.sort(() => 0.5 - Math.random()).slice(0, 3).forEach(b => { lightning.push({ x1: baseX, y1: bottomY, x2: b.x + b.w/2, y2: b.y + b.h/2, life: 1 }); damageBlock(b, dmg * 5); });
            setTimeout(() => { gameState = cacheState; }, 600);
        } else if (type === 'bomb') {
            SFX.explosion(); triggerShake('strong'); let target = activeBlocks[Math.floor(Math.random() * activeBlocks.length)]; let tx = target.x + target.w/2; let ty = target.y + target.h/2;
            createParticle(tx, ty, '💥 BOOM!', '#ff0000');
            activeBlocks.forEach(b => { if (Math.hypot((b.x + b.w/2) - tx, (b.y + b.h/2) - ty) < 120) { damageBlock(b, dmg * 4); } });
            setTimeout(() => { gameState = cacheState; }, 600);
        } else if (type === 'acid') {
            SFX.melt(); triggerShake('mild'); let maxR = -1; activeBlocks.forEach(b => { if(b.y > maxR) maxR = b.y; });
            activeBlocks.filter(b => b.y === maxR).forEach(b => { createParticle(b.x + b.w/2, b.y + b.h/2, 'ACID!', '#aaff00'); damageBlock(b, b.hp); });
            setTimeout(() => { gameState = cacheState; }, 600);
        } else if (type === 'quake') {
            SFX.quake(); triggerShake('strong'); activeBlocks.forEach(b => { damageBlock(b, Math.ceil(dmg * 1.5)); });
            setTimeout(() => { gameState = cacheState; }, 600);
        } else if (type === 'frost') {
            SFX.freeze(); blocksFrozen = true; createParticle(gameWidth/2, gameHeight/2, '❄️ FROST NOVA!', '#00ffff');
            activeBlocks.forEach(b => { damageBlock(b, dmg); }); setTimeout(() => { gameState = cacheState; }, 600);
        }
    }
}

function updateUI() {

    document.getElementById('ui-gold').innerText = player.gold; 
    document.getElementById('ui-atk').innerText = getHeroDmg();

    else if (levelConstraint.type === 'shots') { constraintEl.innerText = `[ 🔴 SHOTS: ${levelConstraint.value} ]`; constraintEl.style.color = levelConstraint.value <= 1 ? '#ff4444' : '#00e5ff'; } 
    else { constraintEl.innerText = ''; }
}

function createParticle(x, y, text, color = '#ffd700', isGold = false) { particles.push({ x: x, y: y, text: text, color: color, life: 1, isGold: isGold }); }
function createDotParticle(x, y, color) { for(let i=0; i<3; i++) particles.push({ x: x, y: y, text: '•', color: color, life: 1, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5 }); }

function damageBlock(b, baseDmg) {
    let isCrit = Math.random() < player.critChance; let finalDmg = isCrit ? Math.ceil(baseDmg * player.critMultiplier) : baseDmg;
    b.hp -= finalDmg; SFX.hit(); b.flashTimer = 8; 
    createParticle(b.x + b.w / 2, b.y + b.h / 2, isCrit ? `CRIT! -${finalDmg}` : `-${finalDmg}`, isCrit ? '#ffaa00' : '#ff0055');
    if(isCrit) triggerShake('mild'); 
    
    if (b.hp <= 0) {
        b.active = false; let prestigeBuff = Math.floor((currentLevel - 1) / 100);
        let earned = Math.floor(Math.random() * 3) + 2 + prestigeBuff;
        for (let c = 0; c < earned; c++) { drops.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: (Math.random() - 0.5) * 6, vy: (Math.random() * -3) - 2, value: 1 }); }
        
        player.xp += Math.floor(Math.random() * 8) + 8 + prestigeBuff; 
        if (player.xp >= player.xpNeeded) {
            player.heroLevel++; player.xp -= player.xpNeeded; player.xpNeeded = Math.floor(player.xpNeeded * 1.6);
            createParticle(gameWidth/2, gameHeight/2, 'LEVEL UP!', '#00e5ff'); SFX.win(); triggerShake('mild');
        }
        updateUI(); triggerShake('mild'); 
        for(let p = 0; p < 8; p++) { particles.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, text: '✦', color: '#fff', life: 1, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8 }); }
        return true;
    }
    return false;
}

function update() {
    if ([STATE.SHOOTING, STATE.AIMING].includes(gameState)) {
        activeFrames++;
        if (activeFrames >= FRAMES_FOR_DRAFT) { activeFrames = 0; triggerPowerupDraft(); return; }
    }
    if (gameState === STATE.POWERUP_ANIM || (![STATE.IDLE, STATE.SHOOTING, STATE.AIMING].includes(gameState))) return;
    let regBalls = balls.filter(b => !b.isClone);

    if (gameState === STATE.SHOOTING) {
        frameCounter++; 
        if (ballsFiredCount < regBalls.length && frameCounter >= framesBetweenShots) {
            let b = regBalls[ballsFiredCount]; b.vx = Math.cos(aimAngle) * ballSpeed; b.vy = Math.sin(aimAngle) * ballSpeed;
            b.active = true; b.returning = false; SFX.shoot(); ballsFiredCount++; frameCounter = 0;
        }
    }

    let allInactive = true;
    for (let i = balls.length - 1; i >= 0; i--) {
        let b = balls[i]; if (!b.active && !b.returning) continue;
        allInactive = false;

        if (b.returning) {
            let dx = nextBaseX - b.x; let dy = (bottomY - b.r) - b.y; let dist = Math.hypot(dx, dy);
            if (dist < ballSpeed) {
                b.x = nextBaseX; b.y = bottomY - b.r; b.vx = 0; b.vy = 0; b.returning = false; b.active = false;
                if (b.isClone) balls.splice(i, 1);
            } else { b.x += (dx / dist) * ballSpeed * 1.3; b.y += (dy / dist) * ballSpeed * 1.3; }
            continue;
        }

        if (!b.active) continue;
        let steps = 4; let subVx = b.vx / steps; let subVy = b.vy / steps;
        
        for (let s = 0; s < steps; s++) {
            let prevX = b.x; let prevY = b.y; b.x += subVx; b.y += subVy;

            if (b.x - b.r <= 0) { b.x = b.r; b.vx *= -1; subVx = b.vx / steps; SFX.bounce(); createDotParticle(b.x, b.y, '#00e5ff'); }
            else if (b.x + b.r >= gameWidth) { b.x = gameWidth - b.r; b.vx *= -1; subVx = b.vx / steps; SFX.bounce(); createDotParticle(b.x, b.y, '#00e5ff'); }
            if (b.y - b.r <= topBound) { b.y = topBound + b.r; b.vy *= -1; subVy = b.vy / steps; SFX.bounce(); createDotParticle(b.x, b.y, '#00e5ff'); }

            if (b.y + b.r >= bottomY) {
                b.y = bottomY - b.r; b.vx = 0; b.vy = 0; b.active = false; b.returning = true;
                createDotParticle(b.x, b.y, '#ffaa00');
                if (!firstBallLanded && !b.isClone) { firstBallLanded = true; nextBaseX = Math.max(15, Math.min(gameWidth - 15, b.x)); }
                break;
            }

            for (let j = 0; j < blocks.length; j++) {
                let blk = blocks[j]; if (!blk.active) continue;
                let rx = blk.x; let ry = blk.y; let rw = blk.w; let rh = blk.h;
                let closestX = Math.max(rx, Math.min(b.x, rx + rw)); let closestY = Math.max(ry, Math.min(b.y, ry + rh));

                let distX = b.x - closestX; let distY = b.y - closestY;
                let distSq = (distX * distX) + (distY * distY);

                if (distSq < (b.r * b.r)) {
                    let hitTopBottom = (prevX >= rx && prevX <= rx + rw); let hitLeftRight = (prevY >= ry && prevY <= ry + rh);
                    if (hitTopBottom) { b.vy *= -1; b.y = prevY; } else if (hitLeftRight) { b.vx *= -1; b.x = prevX; } else { b.vx *= -1; b.vy *= -1; b.x = prevX; b.y = prevY; }
                    
                    subVx = b.vx / steps; subVy = b.vy / steps;
                    createDotParticle(b.x, b.y, '#ff007f'); damageBlock(blk, getHeroDmg()); 
                    break; 
                }
            }
        }
    }

    if (gameState === STATE.SHOOTING && allInactive && ballsFiredCount >= regBalls.length) {
        baseX = nextBaseX; balls.filter(b => !b.isClone).forEach(b => { b.x = baseX; b.y = bottomY - b.r; b.active = false; b.returning = false; }); endTurn();
    }

    for (let i = lasers.length - 1; i >= 0; i--) {
        let l = lasers[i]; l.y -= 25; if (l.y < topBound) { lasers.splice(i, 1); continue; }
        blocks.forEach(blk => { if (blk.active && l.x > blk.x && l.x < blk.x + blk.w && l.y > blk.y && l.y < blk.y + blk.h) { damageBlock(blk, getHeroDmg() * 3); lasers.splice(i, 1); } });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i]; if (p.vx !== undefined) { p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9; } else { p.y -= 1; }
        p.life -= 0.02; if (p.isGold && player.gold > 0) { let targetX = gameWidth / 2; let targetY = 15; p.x += (targetX - p.x) * 0.1; p.y += (targetY - p.y) * 0.1; }
        if (p.life <= 0) particles.splice(i, 1);
    }
    
    for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i]; d.vy += 0.25; d.x += d.vx; d.y += d.vy;
        if (d.x <= 0 || d.x >= gameWidth) { d.vx *= -0.5; d.x = d.x <= 0 ? 0 : gameWidth; }
        if (d.y >= bottomY) {
            let prestigeBuff = Math.floor((currentLevel - 1) / 100); let earnedGold = d.value + prestigeBuff;
            player.gold += earnedGold; SFX.coin(); 
            createParticle(d.x, bottomY - 10, `+${earnedGold}`, '#ffd700', true); 
            createParticle(baseX + (Math.random() - 0.5) * 20, bottomY - 15, '$', '#5efc82'); 
            updateUI(); drops.splice(i, 1);
        }
    }
}

function endTurn() {
    let allCleared = true; let gameOver = false; let stepDown = 46;
    blocks.forEach(b => { if (b.active) { allCleared = false; if (!blocksFrozen) { b.y += stepDown; if (b.y + b.h >= bottomY - 10) gameOver = true; } } });

    if (blocksFrozen) { blocksFrozen = false; createParticle(gameWidth/2, gameHeight/2, 'THAWED', '#aaa'); }

    if (allCleared) {
        if(timerInterval) clearInterval(timerInterval);
        SFX.win(); if (currentLevel === player.maxLevelUnlocked) { player.maxLevelUnlocked++; saveGame(); }
        gameState = STATE.CLEAR; showScreen('screen-clear');
    } else if (gameOver) {
        triggerGameOver("Enemies reached the wall!");
    } else if (levelConstraint.type === 'shots' && levelConstraint.value <= 0) {
        triggerGameOver("Out of Shots!");
    } else { gameState = STATE.IDLE; saveGame(); }
}

function draw() {
    ctx.clearRect(0, 0, gameWidth, gameHeight);

    if (gameState !== STATE.MENU && gameState !== STATE.LEVEL_SELECT) {
        ctx.fillStyle = '#1e1e2f'; ctx.fillRect(0, 0, gameWidth, topBound);
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, topBound); ctx.lineTo(gameWidth, topBound); ctx.stroke();

        ctx.fillStyle = '#223'; ctx.beginPath(); ctx.arc(baseX, bottomY, 20, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.stroke();

        blocks.forEach(b => {
            if (!b.active) return; ctx.save();
            if (b.shape === 'triangle') {
                ctx.translate(b.x + b.w / 2, b.y + b.h / 2);
                if (b.orientation === 'down') ctx.rotate(Math.PI); else if (b.orientation === 'left') ctx.rotate(-Math.PI / 2); else if (b.orientation === 'right') ctx.rotate(Math.PI / 2);
                ctx.translate(-(b.x + b.w / 2), -(b.y + b.h / 2));
            }

            if (b.flashTimer && b.flashTimer > 0) { ctx.filter = 'brightness(500%)'; b.flashTimer--; } else { ctx.filter = 'none'; }
            if (b.img && b.img.complete && b.img.width > 0) { ctx.drawImage(b.img, b.x, b.y, b.w, b.h); } 
            else { ctx.fillStyle = b.shape === 'square' ? '#2575fc' : '#ff007f'; ctx.fillRect(b.x, b.y, b.w, b.h); }
            
            if (blocksFrozen) { ctx.fillStyle = 'rgba(0, 229, 255, 0.3)'; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h); }
            
            ctx.filter = 'none'; ctx.restore();
            ctx.fillStyle = 'white'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'black'; ctx.shadowBlur = 4; ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2); ctx.shadowBlur = 0;
        });
        
        drops.forEach(d => {
            ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI * 2); ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#daa520'; ctx.shadowBlur = 5; ctx.fill();
            ctx.lineWidth = 1; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.shadowBlur = 0;
        });

        ctx.fillStyle = '#ff0055'; ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 10; lasers.forEach(l => { ctx.fillRect(l.x - l.w/2, l.y, l.w, l.h); }); ctx.shadowBlur = 0;
        ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 15;
        for (let i = lightning.length - 1; i >= 0; i--) {
            let l = lightning[i]; ctx.beginPath(); ctx.moveTo(l.x1, l.y1);
            let midX = (l.x1 + l.x2)/2 + (Math.random() - 0.5) * 40; let midY = (l.y1 + l.y2)/2 + (Math.random() - 0.5) * 40;
            ctx.lineTo(midX, midY); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            l.life -= 0.1; if (l.life <= 0) lightning.splice(i, 1);
        }
        ctx.shadowBlur = 0;

        if (gameState === STATE.AIMING) {
            ctx.beginPath(); ctx.moveTo(baseX, bottomY - 8); let aimDist = 300;
            ctx.lineTo(baseX + Math.cos(aimAngle) * aimDist, (bottomY - 8) + Math.sin(aimAngle) * aimDist);
            ctx.strokeStyle = isValidAim ? 'rgba(0, 229, 255, 0.7)' : 'rgba(255, 0, 0, 0.4)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
        }

        balls.forEach((b, idx) => {
            if (!b.active && !b.returning && (b.isClone || idx > 0)) return;
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = b.isClone ? '#aaff00' : '#00e5ff'; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
            ctx.fill(); ctx.shadowBlur = 0;
        });

        particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.globalAlpha = Math.max(0, p.life);
            ctx.shadowColor = 'black'; ctx.shadowBlur = 4; ctx.fillText(p.text, p.x, p.y); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        });
    }
    requestAnimationFrame(() => { update(); draw(); });
}

/* ================= STORAGE ================= */
function saveGame() { 
    let saveObj = { gold: player.gold, maxLevelUnlocked: player.maxLevelUnlocked, heroLevel: player.heroLevel, xp: player.xp, xpNeeded: player.xpNeeded };
    localStorage.setItem('bricks_rpg_save_hardcore', JSON.stringify(saveObj)); 
}
function loadGame() {
    let saved = localStorage.getItem('bricks_rpg_save_hardcore');
    if (saved) {
        let parsed = JSON.parse(saved); player.gold = parsed.gold || 0; player.maxLevelUnlocked = parsed.maxLevelUnlocked || 1;
        if (parsed.heroLevel) { player.heroLevel = parsed.heroLevel; player.xp = parsed.xp; player.xpNeeded = parsed.xpNeeded; }
    }
}

loadGame(); setMainMenuBackground(); setupMenuEvents(); setupGameEvents(); draw();
</script>
