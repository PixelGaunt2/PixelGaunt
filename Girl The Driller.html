<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Girl: The Driller</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050508;
            overflow: hidden; font-family: 'Orbitron', sans-serif; color: #e0e0e8;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; background: transparent; }

        /* --- HUD --- */
        #hud { position: absolute; top: 15px; left: 15px; z-index: 10; background: rgba(10, 10, 15, 0.9); border: 2px solid #00f3ff; border-radius: 10px; padding: 12px 20px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); pointer-events: auto; }
        .resource-row { display: flex; align-items: center; margin: 6px 0; font-weight: bold; font-size: 15px; }
        .res-icon { width: 22px; height: 22px; margin-right: 10px; border-radius: 4px; display: inline-block; }
        .icon-iron { background: #8e8e93; border: 1px solid #aeaeae; }
        .icon-bronze { background: #cd7f32; border: 1px solid #e59866; }
        .icon-gold { background: #d4af37; border: 1px solid #f4d03f; }
        .icon-uranium { background: #39ff14; box-shadow: 0 0 8px #39ff14; }

        /* --- SCORE BOARD --- */
        #score-hud { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(10, 10, 15, 0.95); border: 2px solid #ffcc00; border-radius: 10px; padding: 10px 30px; font-size: 22px; font-weight: bold; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.8); box-shadow: 0 0 15px rgba(255, 204, 0, 0.3); pointer-events: none; }

        /* --- TOOL STATUS HUD --- */
        #tool-status-hud { position: absolute; right: 15px; top: 70px; z-index: 10; background: rgba(10, 10, 15, 0.9); border: 2px solid #555; border-radius: 10px; padding: 10px; pointer-events: none; width: 175px; }
        .sys-row { font-size: 12px; margin: 6px 0; display: flex; align-items: center; justify-content: space-between; }
        .sys-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 5px currentColor; }
        .sys-name { flex-grow: 1; }
        .sys-val { font-weight: bold; }

        /* --- OVERLAYS & MENUS --- */
        #pause-btn { position: absolute; top: 15px; right: 15px; z-index: 15; background: rgba(20, 20, 30, 0.9); border: 2px solid #00f3ff; color: #00f3ff; font-family: 'Orbitron'; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; display: none; }
        #pause-btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 15px #00f3ff; }

        .overlay-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 10, 0.9); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: auto; }
        .overlay-title { font-size: 50px; color: #00f3ff; margin-bottom: 40px; text-shadow: 0 0 20px #00f3ff; text-transform: uppercase; letter-spacing: 2px; }
        .menu-btn { background: #1a1a24; border: 2px solid #00f3ff; color: #00f3ff; font-family: 'Orbitron'; font-size: 20px; font-weight: bold; padding: 15px 40px; border-radius: 8px; cursor: pointer; margin: 10px; width: 250px; transition: 0.3s; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .menu-btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; transform: scale(1.05); }

        @keyframes alertGlow {
            0% { box-shadow: 0 0 5px #ffea00, inset 0 0 5px #ffea00; border-color: #ffea00; color: #ffea00; }
            50% { box-shadow: 0 0 25px #ffea00, inset 0 0 15px #ffea00; border-color: #fff; color: #fff; }
            100% { box-shadow: 0 0 5px #ffea00, inset 0 0 5px #ffea00; border-color: #ffea00; color: #ffea00; }
        }
        .glow-active { animation: alertGlow 1.5s infinite !important; }

        /* --- NEW UPGRADE TREE MODAL --- */
        #menu-upgrades { display: none; position: absolute; top: 5%; left: 5%; width: 90%; height: 85%; background: rgba(10, 15, 20, 0.98); border: 2px solid #00f3ff; border-radius: 15px; z-index: 100; box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); flex-direction: column; pointer-events: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 2px solid #00f3ff; background: rgba(0, 243, 255, 0.1); }
        .modal-title { font-size: 22px; font-weight: bold; color: #00f3ff; text-transform: uppercase; }
        .close-btn { background: transparent; color: #ff3333; border: 2px solid #ff3333; border-radius: 5px; padding: 5px 15px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; transition: 0.2s;}
        .close-btn:hover { background: #ff3333; color: white; box-shadow: 0 0 10px #ff3333; }

        /* --- TREE VISUALS --- */
        #tree-container { flex: 1; overflow: auto; position: relative; background: #050508; }
        #tree-svg { position: absolute; top: 0; left: 0; width: 2000px; height: 1200px; pointer-events: none; z-index: 1; }
        #tree-nodes { position: absolute; top: 0; left: 0; width: 2000px; height: 1200px; z-index: 2; }
        
        .tree-node {
            width: 200px; background: #111; border: 2px solid #00f3ff; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; justify-content: space-between; text-align: center;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); transition: 0.3s;
        }
        .tree-node.locked { opacity: 0.4; filter: grayscale(100%); pointer-events: none; border-color: #444; box-shadow: none; }
        .node-title { font-size: 14px; font-weight: bold; color: #00f3ff; margin-bottom: 5px; }
        .node-desc { font-size: 11px; color: #aaa; margin-bottom: 8px; line-height: 1.2; }
        .node-cost { font-size: 11px; margin-bottom: 8px; font-weight: bold; }
        .node-action { display: flex; flex-direction: column; align-items: center; }
        .node-level { font-size: 12px; margin-bottom: 5px; color: #fff; }
        
        .action-btn { background: #00f3ff; color: #000; border: none; border-radius: 5px; padding: 6px 12px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; font-size: 12px; }
        .action-btn:disabled { background: #444; color: #777; cursor: not-allowed; }
        .action-btn.maxed { background: #39ff14; color: #000; cursor: default; }

        /* --- MINIMAP INSTEAD OF BUTTONS --- */
        #minimap-container {
            position: absolute; bottom: 25px; right: 25px; z-index: 10;
            width: 130px; height: 130px; border-radius: 50%;
            border: 2px solid #00f3ff; background: rgba(5,5,10,0.8);
            overflow: hidden; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            pointer-events: none;
        }

        #level-hud { position: absolute; bottom: 25px; left: 25px; z-index: 10; background: rgba(10, 10, 15, 0.9); border: 2px solid #444; padding: 10px 15px; border-radius: 8px; min-width: 200px; }
        .bar-container { width: 100%; background: #222; height: 12px; border-radius: 6px; margin-top: 5px; border: 1px solid #555; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #ff9900, #ffcc00); width: 40%; transition: width 0.2s; }
        .energy-fill { background: linear-gradient(90deg, #00bfff, #00f3ff); width: 100%; }

        /* --- 6 OVERDRIVES SYSTEM HUD --- */
        #overdrives-container { position: absolute; top: 180px; left: 15px; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; pointer-events: auto; }
        .od-box { background: rgba(10, 10, 15, 0.9); border: 1px solid #555; padding: 6px; border-radius: 6px; width: 130px; text-align: center; }
        .od-name { font-size: 10px; font-weight: bold; margin-bottom: 4px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .od-fill { width: 0%; transition: width 0.3s; }
        .od-btn { margin-top: 5px; width: 100%; padding: 5px 2px; font-size: 9px; background: #333; color: gray; border: 1px solid #555; border-radius: 4px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        #info-toast { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); z-index: 15; background: rgba(0,0,0,0.8); border: 1px solid #00f3ff; padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #00f3ff; pointer-events: none; animation: fadeOut 6s forwards; display: none; }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

    <audio id="bgMusic" src="Titan_Ore_Runner.mp3" loop></audio>
    <canvas id="gameCanvas"></canvas>

    <div id="main-menu" class="overlay-menu">
        <div class="overlay-title">Girl: The Driller</div>
        <button class="menu-btn" onclick="startGame()" style="background: #155f5f;">▶ PLAY NOW</button>
        <button class="menu-btn" onclick="openUpgradesFromMenu()">⚙️ SKILL TREE</button>
        <button class="menu-btn" id="btn-music-toggle" onclick="toggleMusic()">🎵 MUSIC: ON</button>
    </div>

    <div id="pause-menu" class="overlay-menu" style="display: none; background: rgba(5, 5, 8, 0.85);">
        <div class="overlay-title" style="color: #ffea00; text-shadow: 0 0 15px #ffea00;">PAUSED</div>
        <button class="menu-btn" onclick="resumeGame()" style="background: #155f5f; border-color: #ffea00; color: #ffea00;">▶ RESUME</button>
        <button class="menu-btn" onclick="openUpgradesFromPause()">⚙️ SKILL TREE</button>
        <button class="menu-btn" onclick="goToMainMenu()" style="border-color: #ff3333; color: #ff3333;">🏠 MAIN MENU</button>
    </div>

    <button id="pause-btn" onclick="pauseGame()">⏸ PAUSE</button>

    <div id="score-hud">SCORE: $<span id="val-score">0</span></div>

    <div id="hud">
        <div class="resource-row"><div class="res-icon icon-iron"></div> Iron: <span id="val-iron">0</span></div>
        <div class="resource-row"><div class="res-icon icon-bronze"></div> Bronze: <span id="val-bronze">0</span></div>
        <div class="resource-row"><div class="res-icon icon-gold"></div> Gold: <span id="val-gold">0</span></div>
        <div class="resource-row"><div class="res-icon icon-uranium"></div> Uranium: <span id="val-uranium">0</span></div>
    </div>

    <div id="tool-status-hud">
        <div style="color: #fff; font-size: 12px; text-align: center; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px;">ACTIVE SYSTEMS</div>
        <div id="sys-suit" class="sys-row" style="color: #d942ff;"><span class="sys-dot" style="background:#d942ff; color:#d942ff;"></span><span class="sys-name">Girl Suit</span><span class="sys-val" id="val-suit-sys">Normal</span></div>
        <div id="sys-drill" class="sys-row" style="color: #aaa;"><span class="sys-dot" style="background:#aaa; color:#aaa;"></span><span class="sys-name">Auto-Drill</span><span class="sys-val" id="val-drill-sys">ON</span></div>
        <div id="sys-pickaxe" class="sys-row" style="color: #ff9900; display: none;"><span class="sys-dot" style="background:#ff9900; color:#ff9900;"></span><span class="sys-name">Pickaxe</span><span class="sys-val" id="val-pickaxe-sys">Orbit</span></div>
        <div id="sys-rocket" class="sys-row" style="color: #39ff14; display: none;"><span class="sys-dot" style="background:#39ff14; color:#39ff14;"></span><span class="sys-name">Missiles</span><span class="sys-val" id="val-rocket-sys">Ready</span></div>
        <div id="sys-laser" class="sys-row" style="color: #ff3366; display: none;"><span class="sys-dot" style="background:#ff3366; color:#ff3366;"></span><span class="sys-name">Plasma L.</span><span class="sys-val" id="val-laser-sys">Ready</span></div>
        <div id="sys-fireball" class="sys-row" style="color: #00f3ff; display: none;"><span class="sys-dot" style="background:#00f3ff; color:#00f3ff;"></span><span class="sys-name">Fireballs</span><span class="sys-val" id="val-fireball-sys">Ready</span></div>
    </div>

    <div id="overdrives-container">
        <div class="od-box" id="od-box-suit">
            <div class="od-name" style="color:#d942ff;">Girl Power</div>
            <div class="bar-container" style="height:6px; margin-bottom:2px;"><div class="bar-fill od-fill" id="od-fill-suit" style="background:#d942ff;"></div></div>
            <button class="od-btn" id="od-btn-suit" onclick="activateOverdrive('suit')">0/25</button>
        </div>
        <div class="od-box" id="od-box-drill">
            <div class="od-name" style="color:#aaa;">Drill Storm</div>
            <div class="bar-container" style="height:6px; margin-bottom:2px;"><div class="bar-fill od-fill" id="od-fill-drill" style="background:#aaa;"></div></div>
            <button class="od-btn" id="od-btn-drill" onclick="activateOverdrive('drill')">0/25</button>
        </div>
        <div class="od-box" id="od-box-pickaxe" style="display:none;">
            <div class="od-name" style="color:#ff9900;">Axe Fury</div>
            <div class="bar-container" style="height:6px; margin-bottom:2px;"><div class="bar-fill od-fill" id="od-fill-pickaxe" style="background:#ff9900;"></div></div>
            <button class="od-btn" id="od-btn-pickaxe" onclick="activateOverdrive('pickaxe')">0/25</button>
        </div>
        <div class="od-box" id="od-box-rocket" style="display:none;">
            <div class="od-name" style="color:#39ff14;">Missile Rain</div>
            <div class="bar-container" style="height:6px; margin-bottom:2px;"><div class="bar-fill od-fill" id="od-fill-rocket" style="background:#39ff14;"></div></div>
            <button class="od-btn" id="od-btn-rocket" onclick="activateOverdrive('rocket')">0/25</button>
        </div>
        <div class="od-box" id="od-box-laser" style="display:none;">
            <div class="od-name" style="color:#ff3366;">Laser Beam</div>
            <div class="bar-container" style="height:6px; margin-bottom:2px;"><div class="bar-fill od-fill" id="od-fill-laser" style="background:#ff3366;"></div></div>
            <button class="od-btn" id="od-btn-laser" onclick="activateOverdrive('laser')">0/25</button>
        </div>
        <div class="od-box" id="od-box-fireball" style="display:none;">
            <div class="od-name" style="color:#00f3ff;">Inferno</div>
            <div class="bar-container" style="height:6px; margin-bottom:2px;"><div class="bar-fill od-fill" id="od-fill-fireball" style="background:#00f3ff;"></div></div>
            <button class="od-btn" id="od-btn-fireball" onclick="activateOverdrive('fireball')">0/25</button>
        </div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap" width="130" height="130"></canvas>
    </div>

    <div id="level-hud">
        <div style="font-size: 12px; font-weight: bold; justify-content: space-between; display: flex;">
            <span>Ship Level <span id="lbl-level">1</span></span>
            <span id="lbl-xp">0/100 XP</span>
        </div>
        <div class="bar-container"><div id="xp-bar" class="bar-fill"></div></div>
        <div style="font-size: 12px; font-weight: bold; margin-top: 8px;">ENERGY: <span id="lbl-energy">100%</span></div>
        <div class="bar-container"><div id="energy-bar" class="bar-fill energy-fill"></div></div>
    </div>

    <div id="menu-upgrades">
        <div class="modal-header">
            <div class="modal-title">Skill Tree</div>
            <button class="close-btn" onclick="closeUpgradesMenu()">CLOSE X</button>
        </div>
        
        <div id="tree-container">
            <svg id="tree-svg"></svg>
            <div id="tree-nodes"></div>
        </div>
    </div>

<script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    let gameState = "MENU"; 
    let previousState = "MENU";

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('keydown', initAudio, { once: true });
    window.addEventListener('mousedown', initAudio, { once: true });

    const bgMusicElement = document.getElementById('bgMusic');
    bgMusicElement.volume = 0.05;

    function startBgMusic() {
        if (bgMusicElement.paused && document.getElementById('btn-music-toggle').innerText.includes("ON")) {
            bgMusicElement.play().catch(err => console.log("BGM Play prevented by browser auto-play policies.", err));
        }
    }
    
    function toggleMusic() {
        let btn = document.getElementById('btn-music-toggle');
        if (bgMusicElement.paused) {
            bgMusicElement.play();
            btn.innerText = "🎵 MUSIC: ON";
        } else {
            bgMusicElement.pause();
            btn.innerText = "🎵 MUSIC: OFF";
        }
    }

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('pause-btn').style.display = 'block';
        gameState = "PLAYING";
        startBgMusic();
        refreshLiveUiDisplays();
    }

    function pauseGame() {
        if (gameState === "PLAYING") {
            gameState = "PAUSED";
            document.getElementById('pause-menu').style.display = 'flex';
            document.getElementById('pause-btn').style.display = 'none';
        }
    }

    function resumeGame() {
        document.getElementById('pause-menu').style.display = 'none';
        document.getElementById('pause-btn').style.display = 'block';
        gameState = "PLAYING";
    }

    function goToMainMenu() {
        document.getElementById('pause-menu').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
        gameState = "MENU";
    }

    function openUpgradesFromMenu() {
        previousState = "MENU";
        document.getElementById('main-menu').style.display = 'none';
        openUpgradesMenu();
    }

    function openUpgradesFromPause() {
        previousState = "PAUSED";
        document.getElementById('pause-menu').style.display = 'none';
        openUpgradesMenu();
    }

    function openUpgradesMenu() {
        gameState = "UPGRADES";
        document.getElementById('menu-upgrades').style.display = 'flex';
        renderVisualTree(); 
    }

    function closeUpgradesMenu() {
        document.getElementById('menu-upgrades').style.display = 'none';
        if (previousState === "MENU") {
            document.getElementById('main-menu').style.display = 'flex';
            gameState = "MENU";
        } else if (previousState === "PAUSED") {
            document.getElementById('pause-menu').style.display = 'flex';
            gameState = "PAUSED";
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        let now = audioCtx.currentTime;

        if (type === 'laser') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
            gainNode.gain.setValueAtTime(0.01, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'collect') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'coin') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(1500, now); osc.frequency.setValueAtTime(2000, now + 0.05);
            gainNode.gain.setValueAtTime(0.08, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'explode') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
            gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3); osc.start(now); osc.stop(now + 0.3);
        } else if (type === 'hit') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'thrust') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(60, now); gainNode.gain.setValueAtTime(0.02, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.1); osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'drill_deploy') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(150, now + 0.2);
            gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.2); osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'drill_hit') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, now); gainNode.gain.setValueAtTime(0.03, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'levelup') {
            osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2); osc.frequency.setValueAtTime(880, now + 0.3);
            gainNode.gain.setValueAtTime(0.08, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.6); osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); gainNode.gain.setValueAtTime(0.05, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 0.05); osc.start(now); osc.stop(now + 0.05);
        }
    }

    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    const specialItemImages = [
        "1Gemini_Generated_Image_6xioe36xioe36xio-removebg-preview.png", "1Gemini_Generated_Image_bvd3ofbvd3ofbvd3-removebg-preview.png",
        "1Gemini_Generated_Image_bl1w4wbl1w4wbl1w-removebg-preview.png", "1Gemini_Generated_Image_ajy9avajy9avajy9-removebg-preview (1).png",
        "1Gemini_Generated_Image_x1qgbzx1qgbzx1qg-removebg-preview.png", "1Gemini_Generated_Image_4jjzai4jjzai4jjz-removebg-preview.png"
    ].map(src => { let img = new Image(); img.src = src; return img; });

            { id: 'energy', title: 'Energy Sys', nodes: upgradeTrees.energy },
            { id: 'drill', title: 'Drilling', nodes: upgradeTrees.drill },
            { id: 'laser', title: 'Laser Weapon', nodes: upgradeTrees.weapon.laser },    
            { id: 'fireball', title: 'Fireball', nodes: upgradeTrees.weapon.fireball }, 
            { id: 'rocket', title: 'Missiles', nodes: upgradeTrees.rocket }

        let svgHTML = ''; let html = '';

        columns.forEach((col, colIdx) => {
            let x = colIdx * 240 + 40; 
            html += `<div style="position:absolute; left:${x}px; top:20px; width:200px; text-align:center; color:#ff9900; font-weight:bold; font-size:16px; border-bottom:1px solid #ff9900; padding-bottom:5px;">${col.title.toUpperCase()}</div>`;

            let prevUnlocked = true;
            col.nodes.forEach((upg, rowIdx) => {
                let y = rowIdx * 160 + 70;
                let locked = !prevUnlocked;

                if (rowIdx < col.nodes.length - 1) {
                    let nextY = (rowIdx + 1) * 160 + 70;
                    let lineColor = locked ? '#333' : '#00f3ff';
                    svgHTML += `<line x1="${x+100}" y1="${y+130}" x2="${x+100}" y2="${nextY}" stroke="${lineColor}" stroke-width="3" />`;
                }

                let level = upgradeLevels[upg.id];
                let maxed = level >= upg.maxLevel;
                let currentCost = getCost(upg.cost, level);
                let afford = canAfford(currentCost);

                if (level === 0) prevUnlocked = false;

                let btnState = ""; let btnText = level === 0 ? "UNLOCK" : "UPGRADE";
                if(maxed) { btnState = "disabled class='action-btn maxed'"; btnText = "MAXED"; }

    };

    window.purchaseUpgrade = function(id, tab, subTree = null) {
        let list = subTree ? upgradeTrees[tab][subTree] : upgradeTrees[tab];
        let upg = list.find(u => u.id === id);
        let currentCost = getCost(upg.cost, upgradeLevels[id]);

        if(canAfford(currentCost) && upgradeLevels[id] < upg.maxLevel) {
            for(let res in currentCost) { inventory[res] -= currentCost[res]; }
            upgradeLevels[id]++;
            
            if(upg.effect) {
                if(typeof upg.value === 'boolean') playerStats[upg.effect] = upg.value;
                else playerStats[upg.effect] += upg.value;
            }
            if(upg.effect === 'hasPickaxe' && handMines.length === 0) { handMines = [{x: playerShip.x, y: playerShip.y}, {x: playerShip.x, y: playerShip.y}]; overdrives.pickaxe.unlocked = true; }
            if(upg.effect === 'hasRocket') overdrives.rocket.unlocked = true;
            if(upg.effect === 'hasLaser') overdrives.laser.unlocked = true;
            if(upg.effect === 'hasFireball') overdrives.fireball.unlocked = true;

            playSound('levelup'); addFloatingText(`${upg.name} UPGRADED!`, playerShip.x, playerShip.y - 40, '#00f3ff', "16px");
            renderVisualTree(); refreshLiveUiDisplays();
        } else { playSound('click'); }
    }

            createParticle(fb.x, fb.y, '#00aaff', -fb.vx*0.2, -fb.vy*0.2, 0.1, 7); ctx.beginPath(); ctx.arc(fb.x, fb.y, 22, 0, Math.PI*2); ctx.fillStyle='#00f3ff'; ctx.fill();

            let hit = false;
            for(let j = 0; j < asteroidsList.length; j++) {
                let ast = asteroidsList[j]; let astHealthPercent = ast.health / ast.maxHealth; let bloatScale = 1 + (1 - astHealthPercent) * 0.4;
                if (Math.hypot(ast.x - fb.x, ast.y - fb.y) < (ast.radius * bloatScale) + 25) { ast.health -= playerStats.damage * 0.5; createParticle(fb.x, fb.y, '#00f3ff', (Math.random()-0.5)*12, (Math.random()-0.5)*12, 0.05, 6); hit = true; break; }
            }
            if (hit || fb.life <= 0) thrownFireballs.splice(i, 1);
        }

        if (playerStats.hasLaser && asteroidsList.length > 0) {
            let isLaserOd = overdrives.laser.activeTimer > 0;
            if (isLaserOd || frameCount % 60 === 0) {
                ctx.save(); ctx.globalCompositeOperation = "lighter"; let currentSourceX = playerShip.x; let currentSourceY = playerShip.y; let unvisited = [...asteroidsList]; let chainCount = 0;
                
                let baseLaserWidth = Math.min(25, 4 + (upgradeLevels['wpn_laser3'] * 0.1));
                let maxTargets = isLaserOd ? Math.min(10, 2 + Math.floor(upgradeLevels['wpn_laser2'] / 20)) : 1;

                while (unvisited.length > 0) {
                    if (chainCount >= maxTargets) break;
                    let targetAst = null; let minDist = 1500; let targetIndex = -1;
                    for (let j = 0; j < unvisited.length; j++) { let d = Math.hypot(unvisited[j].x - currentSourceX, unvisited[j].y - currentSourceY); if (d < minDist) { minDist = d; targetAst = unvisited[j]; targetIndex = j; } }
                    if (targetAst) {
                        const bX = targetAst.x - currentSourceX; const bY = targetAst.y - currentSourceY; const pAngle = Math.atan2(bY, bX) + Math.PI / 2;
                        ['rgba(255, 50, 100, 0.8)', '#ffffff'].forEach((color, idx) => { ctx.beginPath(); ctx.lineWidth = idx === 0 ? baseLaserWidth : baseLaserWidth * 0.4; ctx.strokeStyle = color; ctx.moveTo(currentSourceX, currentSourceY); for (let i = 1; i <= 12; i++) { let offset = (i < 12) ? (Math.random() - 0.5) * 15 : 0; ctx.lineTo(currentSourceX + bX * (i/12) + Math.cos(pAngle) * offset, currentSourceY + bY * (i/12) + Math.sin(pAngle) * offset); } ctx.stroke(); });
                        targetAst.health -= playerStats.damage * (isLaserOd ? 0.1 : 0.8);
                        if (Math.random() < 0.2) createParticle(targetAst.x, targetAst.y, '#ff3366', (Math.random()-0.5)*5, (Math.random()-0.5)*5, 0.1, 1.5); currentSourceX = targetAst.x; currentSourceY = targetAst.y; unvisited.splice(targetIndex, 1); chainCount++;
                    } else break;
                }
                ctx.restore(); if (chainCount > 0 && Math.random() < 0.2) playSound('laser');
            }
        }

        for(let i=visualParticles.length-1; i>=0; i--) { let p = visualParticles[i]; p.x += p.vx; p.y += p.vy; p.life -= p.decay; if(p.life <= 0) visualParticles.splice(i, 1); else { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size); } } ctx.globalAlpha = 1.0; 
        for(let i = shockwaves.length - 1; i >= 0; i--) { let sw = shockwaves[i]; sw.radius += sw.speed; sw.life -= 0.04; if(sw.life <= 0) shockwaves.splice(i, 1); else { ctx.save(); ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.strokeStyle = sw.color; ctx.lineWidth = 3 * sw.life; ctx.globalAlpha = sw.life; ctx.stroke(); ctx.restore(); } }

        for (let i = homingParticles.length - 1; i >= 0; i--) {
            let hp = homingParticles[i];
            let checkDist = Math.hypot(playerShip.x - hp.x, playerShip.y - hp.y);
            let magnetCheckArea = (playerStats.magnetRadius * 15) + (overdrives.suit.activeTimer > 0 ? 1000 : 0);

            if (hp.timer > 0 && checkDist > magnetCheckArea) { hp.timer--; hp.x += hp.vx; hp.y += hp.vy; hp.vx *= 0.92; hp.vy *= 0.92; hp.spin += 0.1; } else {
                let dx = playerShip.x - hp.x; let dy = playerShip.y - hp.y;
                if (checkDist < playerShip.radius + playerStats.magnetRadius + (overdrives.suit.activeTimer > 0 ? 50 : 0)) {
                    if (hp.typeInfo.isCoin) { let scoreEarned = hp.value * 250; playerStats.score += scoreEarned; playSound('coin'); addFloatingText(`+$${scoreEarned}`, hp.x, hp.y, hp.typeInfo.color, "15px"); } 
                    else { 
                        inventory[hp.typeInfo.name] += hp.value; let scoreEarned = hp.value * 1500; playerStats.score += scoreEarned; playSound('collect'); addFloatingText(`+${hp.value} ${hp.typeInfo.name.toUpperCase()}`, hp.x, hp.y, hp.typeInfo.color); 
                        
                        for(let key in overdrives) {
                            if(overdrives[key].unlocked && overdrives[key].activeTimer <= 0 && overdrives[key].cooldownTimer <= 0) {
                                overdrives[key].charge = Math.min(overdrives[key].maxCharge, overdrives[key].charge + 1);
                                if(overdrives[key].charge === overdrives[key].maxCharge) refreshLiveUiDisplays();
                            }
                        }
                    }
                    homingParticles.splice(i, 1); continue;
                } else { let angleToPlayer = Math.atan2(dy, dx); hp.x += Math.cos(angleToPlayer) * 12; hp.y += Math.sin(angleToPlayer) * 12; hp.spin += 0.2; }
            }
            ctx.save(); ctx.translate(hp.x, hp.y); ctx.rotate(hp.spin); 
            if (hp.typeInfo.isCoin) { ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#ffaa00'; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = '#aa6600'; ctx.font = 'bold 12px Orbitron'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('$', 0, 1); } else { ctx.fillStyle = hp.typeInfo.color; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(12, 0); ctx.lineTo(0, 12); ctx.lineTo(-12, 0); ctx.fill(); if (hp.img && hp.img.complete && hp.img.naturalWidth !== 0) ctx.drawImage(hp.img, -10, -10, 20, 20); } ctx.restore();
        }

        for (let i = drillsList.length - 1; i >= 0; i--) {
            let drill = drillsList[i]; drill.life--;
            if (!drill.target || drill.target.health <= 0 || !asteroidsList.includes(drill.target)) { let closest = null; let minDist = 9999; asteroidsList.forEach(ast => { let d = Math.hypot(ast.x - drill.x, ast.y - drill.y); if(d < minDist) { minDist = d; closest = ast; }}); drill.target = closest; }
            let drawX = drill.x; let drawY = drill.y; createParticle(drill.x - Math.cos(drill.angle)*15, drill.y - Math.sin(drill.angle)*15, '#ffaa00', -Math.cos(drill.angle)*2, -Math.sin(drill.angle)*2, 0.1, 4);

            if (drill.target) {
                let dx = drill.target.x - drill.x; let dy = drill.target.y - drill.y; let dist = Math.hypot(dx, dy); let activeTargetRadius = drill.target.radius * (1 + (1 - (drill.target.health / drill.target.maxHealth)) * 0.4);
                if (dist > activeTargetRadius + 12) { drill.angle = Math.atan2(dy, dx); drill.x += Math.cos(drill.angle) * playerStats.drillFlySpeed; drill.y += Math.sin(drill.angle) * playerStats.drillFlySpeed; createParticle(drill.x - Math.cos(drill.angle)*16, drill.y - Math.sin(drill.angle)*16, '#ff9900', -Math.cos(drill.angle)*2, -Math.sin(drill.angle)*2, 0.1, 2.5); } else { drill.x = drill.target.x - Math.cos(drill.angle) * (activeTargetRadius + 10); drill.y = drill.target.y - Math.sin(drill.angle) * (activeTargetRadius + 10); drill.target.health -= playerStats.damage * 0.1; drawX += (Math.random() - 0.5) * 5; drawY += (Math.random() - 0.5) * 5; if (Math.random() < 0.1) playSound('drill_hit'); spawnCollisionEffect(drill.target.x, drill.target.y); createParticle(drill.x + Math.cos(drill.angle)*16, drill.y + Math.sin(drill.angle)*16, '#ffffff', (Math.random()-0.5)*5, (Math.random()-0.5)*5, 0.1, 1.5); }
            } else { drill.x += Math.cos(drill.angle) * playerStats.drillFlySpeed; drill.y += Math.sin(drill.angle) * playerStats.drillFlySpeed; }

            if (drillImage.complete && drillImage.naturalWidth !== 0) { ctx.save(); ctx.translate(drawX, drawY); ctx.rotate(drill.angle + Math.PI/2); ctx.drawImage(drillImage, -12, -18, 24, 36); ctx.restore(); } else { ctx.beginPath(); ctx.arc(drawX, drawY, 5, 0, Math.PI*2); ctx.fillStyle = "red"; ctx.fill(); }
            if (drill.life <= 0) { createParticle(drill.x, drill.y, '#ff3333', 0, 0, 0.1, 15); drillsList.splice(i, 1); }
        }

        let spawnChance = 0.02 + (playerStats.level * 0.002);
        let maxAsteroidsOnScreen = 15 + (playerStats.level * 2);

        if (isMoving && asteroidsList.length < maxAsteroidsOnScreen && Math.random() < spawnChance) produceAsteroidNode();
        if (isMoving && !magicCrystalEvent.active && Math.random() < 0.002) { let spawnAngle = Math.random() * Math.PI * 2; let spawnDist = Math.random() * 500 + 400; magicCrystalEvent.spawn(playerShip.x + Math.cos(spawnAngle) * spawnDist, playerShip.y + Math.sin(spawnAngle) * spawnDist); }
        if (frameCount % 60 === 0) asteroidsList = asteroidsList.filter(ast => Math.hypot(ast.x - playerShip.x, ast.y - playerShip.y) < 2500);

        for (let i = asteroidsList.length - 1; i >= 0; i--) {
            let ast = asteroidsList[i]; ast.x += ast.vx; ast.y += ast.vy; ast.spinAngle += ast.spinVelocity;
            let astBhDistX = blackHole.x - ast.x; let astBhDistY = blackHole.y - ast.y; let astBhDist = Math.hypot(astBhDistX, astBhDistY);
            if (astBhDist < 1200) { let astPull = (1200 - astBhDist) / 1200 * 0.005; ast.vx += (astBhDistX / astBhDist) * astPull; ast.vy += (astBhDistY / astBhDist) * astPull; }
            if (astBhDist < blackHole.radius) { asteroidsList.splice(i, 1); continue; }

            let healthPercent = ast.health / ast.maxHealth; let bloatScale = 1 + (1 - healthPercent) * 0.4; 
            ctx.save(); ctx.translate(ast.x, ast.y); ctx.rotate(ast.spinAngle); ctx.scale(bloatScale, bloatScale); if (ast.img && ast.img.complete && ast.img.naturalWidth !== 0) ctx.drawImage(ast.img, -ast.radius, -ast.radius, ast.radius * 2, ast.radius * 2); ctx.restore();
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(ast.x - 20, ast.y - (ast.radius * bloatScale) - 15, 40, 5); ctx.fillStyle = ast.typeInfo.color; ctx.fillRect(ast.x - 20, ast.y - (ast.radius * bloatScale) - 15, 40 * healthPercent, 5);

            if (ast.health <= 0) {
                cameraShake = 15; playSound('explode'); shockwaves.push({x: ast.x, y: ast.y, radius: ast.radius * bloatScale, speed: 6, life: 1.0, color: ast.typeInfo.color}); for(let k=0; k<20; k++) createParticle(ast.x, ast.y, ast.typeInfo.color, (Math.random()-0.5)*18, (Math.random()-0.5)*18, 0.03, Math.random()*4 + 2); 
                
                let levelRewardMultiplier = 1 + Math.floor(playerStats.level / 5);
                let rewardAmount = Math.floor(Math.random() * (ast.typeInfo.rewardMax - ast.typeInfo.rewardMin + 1)) + ast.typeInfo.rewardMin;
                
                for(let k = 0; k < rewardAmount; k++) homingParticles.push({ x: ast.x, y: ast.y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15, typeInfo: ast.typeInfo, img: mineralImages[Math.floor(Math.random() * mineralImages.length)], value: levelRewardMultiplier, timer: 60, spin: Math.random() * Math.PI * 2 });
                
                let coinAmount = Math.floor(Math.random() * 3) + 2; for(let k = 0; k < coinAmount; k++) homingParticles.push({ x: ast.x, y: ast.y, vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15, typeInfo: { name: 'coin', color: '#ffd700', isCoin: true }, img: null, value: levelRewardMultiplier, timer: 60, spin: Math.random() * Math.PI * 2 });

                playerStats.xp += Math.floor(ast.typeInfo.baseHealth / 5);
                if (playerStats.xp >= playerStats.nextLevelXp) { playerStats.xp -= playerStats.nextLevelXp; playerStats.level++; playerStats.nextLevelXp = Math.floor(playerStats.nextLevelXp * 1.4); addFloatingText("LEVEL UP! 🌟", playerShip.x, playerShip.y - 45, '#ffcc00', "18px"); playSound('levelup'); }
                asteroidsList.splice(i, 1); refreshLiveUiDisplays();
            }
        }

        if (playerStats.hasPickaxe && handMines.length === 2) {
            let isAxeOd = overdrives.pickaxe.activeTimer > 0;
            let orbitSpeed = isAxeOd ? -timeNow / 50 : -timeNow / 250;
            let pRadius = isAxeOd ? 200 : 105;

            let screenTargets = asteroidsList.filter(ast => Math.hypot(ast.x - playerShip.x, ast.y - playerShip.y) < Math.max(canvas.width, canvas.height)*0.7);

            for(let i=0; i<2; i++) {
                let hm = handMines[i]; let targetAst = null; let minDist = 2500; 
                let isDigging = false; 
                
                for(let a of screenTargets) { let d = Math.hypot(a.x - hm.x, a.y - hm.y); if(d < minDist) { minDist = d; targetAst = a; } }
                
                if (targetAst) { 
                    hm.x += (targetAst.x - hm.x) * (isAxeOd ? 0.3 : 0.15); 
                    hm.y += (targetAst.y - hm.y) * (isAxeOd ? 0.3 : 0.15); 
                    if(minDist < targetAst.radius + 30) { 
                        targetAst.health -= playerStats.damage * (isAxeOd ? 0.3 : 0.08); 
                        createParticle(hm.x, hm.y, '#ff9900', (Math.random()-0.5)*8, (Math.random()-0.5)*8, 0.1, 4); 
                        isDigging = true; 
                    } 
                } else { 
                    let pAngle = orbitSpeed + (i * Math.PI); 
                    let targetX = playerShip.x + Math.cos(pAngle) * pRadius; 
                    let targetY = playerShip.y + Math.sin(pAngle) * pRadius; 
                    hm.x += (targetX - hm.x) * 0.15; hm.y += (targetY - hm.y) * 0.15; 
                }
                
                ctx.save(); ctx.translate(hm.x, hm.y); 
                
                let drawAngle = (timeNow/200) + i; 
                if (isDigging && targetAst) {
                    drawAngle = Math.atan2(targetAst.y - hm.y, targetAst.x - hm.x) + Math.PI/4; 
                    let swing = Math.sin(timeNow / 40) * 1.5;
                    ctx.rotate(drawAngle + swing); 
                    
                    if (pickaxeImg.complete && pickaxeImg.naturalWidth !== 0) { ctx.drawImage(pickaxeImg, -10, -40, 50, 50); } else { ctx.fillStyle = '#ff9900'; ctx.fillRect(-10,-40,30,30); }
                } else {
                    ctx.rotate(drawAngle); 
                    if (pickaxeImg.complete && pickaxeImg.naturalWidth !== 0) { ctx.drawImage(pickaxeImg, -25, -25, 50, 50); } else { ctx.fillStyle = '#ff9900'; ctx.fillRect(-25,-25,30,30); }
                }
                ctx.restore();
            }
        }

        for (let i = textParticles.length - 1; i >= 0; i--) { let tp = textParticles[i]; tp.y -= 0.6; tp.life--; ctx.globalAlpha = Math.min(1, tp.life / 20); ctx.fillStyle = tp.color; ctx.font = `bold ${tp.size} 'Orbitron'`; ctx.fillText(tp.text, tp.x, tp.y); ctx.globalAlpha = 1.0; if (tp.life <= 0) textParticles.splice(i, 1); }

        const minimapCanvas = document.getElementById('minimap');
        if (minimapCanvas) {
            const mCtx = minimapCanvas.getContext('2d');
            mCtx.clearRect(0, 0, 130, 130);
            
            mCtx.save();
            mCtx.translate(65, 65); 
            let mapScale = 0.015; 

            asteroidsList.forEach(a => {
                mCtx.beginPath();
                mCtx.arc((a.x - playerShip.x)*mapScale, (a.y - playerShip.y)*mapScale, Math.max(1, a.radius*mapScale), 0, Math.PI*2);
                mCtx.fillStyle = a.typeInfo.color;
                mCtx.fill();
            });

            mCtx.beginPath();
            mCtx.arc(0, 0, 3, 0, Math.PI*2);
            mCtx.fillStyle = '#00f3ff';
            mCtx.fill();

            mCtx.restore();
        }

        ctx.restore(); requestAnimationFrame(renderFrame);
    }
    
    refreshLiveUiDisplays(); requestAnimationFrame(renderFrame);
</script>
