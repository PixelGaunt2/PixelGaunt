name = "pixelgaunt-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Public, non-secret settings. Your Firebase project ID is not sensitive -
# it's already visible in firebase-auth.js and every browser network tab.
[vars]
FIREBASE_PROJECT_ID = "pixelgaunt-e5235"
ALLOWED_ORIGIN = "https://pixelgaunt.com"

# Secrets (set with `wrangler secret put <NAME>`, never written to this file
# or committed to the repo):
#   FIREBASE_SERVICE_ACCOUNT_JSON   the full JSON key file, as one string
#   BOOTSTRAP_ADMIN_KEY              a random string only you know, used once
#                                    to create the first admin account
#
#   Manual payment instructions (all optional - each defaults to "Not yet
#   configured" in the dashboard until you set it). Put the real account
#   number/IBAN/phone number plus short instructions as one string, e.g.:
#     wrangler secret put PAYMENT_INFO_EASYPAISA
#     > Easypaisa: 03XX-XXXXXXX (Account title: PIXELGAUNT). Send the PKR
#     > equivalent of $1.99, then submit the transaction ID below.
#   PAYMENT_INFO_EASYPAISA
#   PAYMENT_INFO_MEEZAN_BANK
#   PAYMENT_INFO_BANK_ALFALAH
#   PAYMENT_INFO_NAYAPAY
#   PAYMENT_INFO_SADAPAY
#
#   These go in as secrets (not [vars]) even though they aren't "secret" in
#   the security sense, because wrangler.toml is committed to your repo and
#   real account numbers shouldn't sit in git history.
